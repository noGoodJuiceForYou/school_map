# 配置模板：复制为 application.yml 后填入真实值
#   cp application.example.yml application.yml
# application.yml 已被 .gitignore 忽略，请勿提交真实密钥
# 也可以直接用环境变量注入，下面的 ${VAR:default} 写法会自动读取环境变量

server:
  port: 8080

spring:
  ai:
    dashscope:
      api-key: ${DASHSCOPE_API_KEY:your-dashscope-api-key}
  application:
    name: school-map
  # 数据库连接信息
  datasource:
    url: jdbc:mysql://localhost:3306/school_map
    driver-class-name: com.mysql.cj.jdbc.Driver
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:your-mysql-password}
  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 50MB

mybatis:
  mapper-locations: classpath:mapper/*.xml
  type-aliases-package: com.map.pojo
  configuration:
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
    # 开启驼峰命名映射开关
    map-underscore-to-camel-case: true

logging:
  level:
    org.springframework.jdbc.support.JdbcTransactionManager: debug

# 阿里云 OSS 配置
yyc:
  alioss:
    bucketName: ${OSS_BUCKET_NAME:your-bucket-name}
    endpoint: ${OSS_ENDPOINT:oss-cn-beijing.aliyuncs.com}
    access-key-id: ${OSS_ACCESS_KEY_ID:your-access-key-id}
    access-key-secret: ${OSS_ACCESS_KEY_SECRET:your-access-key-secret}
